name: OTA Update (EAS)

on:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci
        working-directory: electro-pime

      - name: Publish OTA update
        working-directory: electro-pime
        env:
          EXPO_PUBLIC_API_URL: https://repair-service-api.vercel.app
        run: eas update --branch preview --message "Auto OTA from ${{ github.sha }}" --non-interactive
